# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9f4409e0dee582b54af7f12aadff1f34"
name = "pencil-shop-eclat"
application_url = "https://pencil-shop-eclat.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_inventory,read_products,read_publications,write_app_proxy,write_files,write_inventory,write_product_listings,write_products,write_publications"

[auth]
redirect_urls = [
  "https://pencil-shop-eclat.fly.dev/auth/callback",
  "https://pencil-shop-eclat.fly.dev/auth/shopify/callback",
  "https://pencil-shop-eclat.fly.dev/api/auth/callback"
]

[app_proxy]
url = "https://pencil-shop-eclat.fly.dev/apps/pencilshopeclat"
subpath = "pencilshopeclat"
prefix = "apps"
