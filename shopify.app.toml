# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f97fd26af6baf728a1f09a8f5de379b3"
name = "pencil-shop"
application_url = "https://api.pencildesign.co"
embedded = false

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_inventory,read_products,read_publications,write_app_proxy,write_files,write_inventory,write_product_listings,write_products,write_publications"
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://api.pencildesign.co/shopify/callback"
]

[webhooks]
api_version = "2026-07"

# App lifecycle webhook
[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

# ✅ Required privacy compliance webhooks
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "/webhooks/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "/webhooks/shop/redact"
